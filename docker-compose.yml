version: '3.8'

services:
  # PostgreSQL Relational Database for Multi-Tenancy & Audit Logging
  db:
    image: postgres:16-alpine
    container_name: inspectra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspectra_secret}
      POSTGRES_DB: ${POSTGRES_DB:-inspectra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspectra} -d ${POSTGRES_DB:-inspectra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Asynchronous CV/OCR Task Queue
  redis:
    image: redis:7-alpine
    container_name: inspectra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Object Storage for Evidence Images & Reports
  storage:
    
    image: minio/minio:latest
    container_name: inspectra-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inspectra Next.js API & Enforcement Web Application (stateless, horizontally scalable)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectra-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-inspectra}:${POSTGRES_PASSWORD:-inspectra_secret}@db:5432/${POSTGRES_DB:-inspectra_db}"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: ${SESSION_SECRET:-inspectra-super-secret-key-salt-2026}
      S3_ENDPOINT: "http://storage:9000"
      S3_BUCKET: ${S3_BUCKET:-inspectra-evidence}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: "us-east-1"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - evidence_vault:/app/.scan-store

  # Inspectra analysis worker fleet (gate → YOLO → OCR → compliance).
  # Scale with: docker compose up --scale worker=3
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectra-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-inspectra}:${POSTGRES_PASSWORD:-inspectra_secret}@db:5432/${POSTGRES_DB:-inspectra_db}"
      REDIS_URL: "redis://redis:6379"
      S3_ENDPOINT: "http://storage:9000"
      S3_BUCKET: ${S3_BUCKET:-inspectra-evidence}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: "us-east-1"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - evidence_vault:/app/.scan-store

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evidence_vault:
